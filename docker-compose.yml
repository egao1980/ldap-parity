services:
  openldap:
    image: osixia/openldap:1.5.0
    ports:
      - "389:389"
    environment:
      LDAP_ORGANISATION: Example Inc
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
      LDAP_TLS: "false"
      LDAP_RFC2307BIS_SCHEMA: "false"
    volumes:
      - ./fixtures/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/01-bootstrap.ldif:ro
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1:389 -b dc=example,dc=com -s base >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
